```yaml
name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: OrangeFox Branch
        required: true
        default: "12.1"
        type: choice
        options:
          - "12.1"
          - "11.0"

      DEVICE_TREE:
        description: Custom Recovery Tree
        required: true
        default: "https://github.com/rimurum/android_device_nothing_Pacman"

      DEVICE_TREE_BRANCH:
        description: Custom Recovery Tree Branch
        required: true
        default: "android-15"

      DEVICE_PATH:
        description: Specify your device path
        required: true
        default: "device/nothing/Pacman"

      DEVICE_NAME:
        description: Specify your Device Codename
        required: true
        default: "Pacman"

      BUILD_TARGET:
        description: Specify your Build Target
        required: true
        default: "vendorboot"
        type: choice
        options:
          - "boot"
          - "recovery"
          - "vendorboot"

      LDCHECK:
        description: Path of blobs to check
        required: false
        default: "system/bin/qseecomd"

      RECOVERY_TAR:
        description: Release recovery.tar for Samsung devices
        required: false
        default: false
        type: boolean

      RECOVERY_INSTALLER:
        description: Include recovery installer zip
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display Inputs
        run: |
          echo "Manifest branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device tree: ${{ inputs.DEVICE_TREE }}"
          echo "Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device path: ${{ inputs.DEVICE_PATH }}"
          echo "Device name: ${{ inputs.DEVICE_NAME }}"
          echo "Build target: ${{ inputs.BUILD_TARGET }}"
          echo "LDCheck: ${{ inputs.LDCHECK }}"
          echo "Recovery TAR: ${{ inputs.RECOVERY_TAR }}"
          echo "Recovery Installer: ${{ inputs.RECOVERY_INSTALLER }}"

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Build Environment
        run: |
          set -e

          sudo apt update

          git clone https://gitlab.com/OrangeFox/misc/scripts

          cd scripts

          sudo bash setup/android_build_env.sh

      - name: Set-up Manifest
        run: |
          set -e

          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"

          cd "${GITHUB_WORKSPACE}/OrangeFox"

          git config --global user.name "Pantelis"
          git config --global user.email "rimurum@pm.me"

          git clone https://gitlab.com/OrangeFox/sync.git

          cd sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch "${{ inputs.MANIFEST_BRANCH }}" \
            --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

          if [ ! -f "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/build/envsetup.sh" ]; then
            echo "ERROR: OrangeFox source was not synced correctly."
            echo "Expected:"
            echo "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/build/envsetup.sh"
            exit 1
          fi

      - name: Clone Device Tree
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

          mkdir -p "$(dirname "${{ inputs.DEVICE_PATH }}")"

          git clone \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" \
            "${{ inputs.DEVICE_PATH }}"

          cd "${{ inputs.DEVICE_PATH }}"

          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Building OrangeFox
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          if [ "${{ inputs.MANIFEST_BRANCH }}" = "11.0" ] || [ "${{ inputs.MANIFEST_BRANCH }}" = "12.1" ]; then
            lunch "twrp_${{ inputs.DEVICE_NAME }}-eng"
            make clean
            mka adbd "${{ inputs.BUILD_TARGET }}image"
          else
            lunch "omni_${{ inputs.DEVICE_NAME }}-eng"
            make clean
            mka "${{ inputs.BUILD_TARGET }}image"
          fi

      - name: Set Build Date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Check if Recovery Exists
        run: |
          set -e

          PRODUCT_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}"

          if [ ! -d "$PRODUCT_DIR" ]; then
            echo "ERROR: Product directory does not exist:"
            echo "$PRODUCT_DIR"
            exit 1
          fi

          IMG=$(find "$PRODUCT_DIR" -type f -name "OrangeFox*.img" | head -n 1)

          if [ -z "$IMG" ]; then
            echo "ERROR: OrangeFox image was not found."
            find "$PRODUCT_DIR" -maxdepth 2 -type f | head -100
            exit 1
          fi

          echo "Found image: $IMG"

          echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"
          echo "FILE_PATH=$(dirname "$IMG")" >> "$GITHUB_ENV"
          echo "MD5_IMG=$(md5sum "$IMG" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Rename the Recovery
        run: |
          set -e

          cd "$FILE_PATH"

          IMG=$(find . -maxdepth 1 -type f -name "OrangeFox*.img" | head -n 1)

          if [ -z "$IMG" ]; then
            echo "ERROR: OrangeFox image not found."
            exit 1
          fi

          if [ "${{ inputs.BUILD_TARGET }}" = "boot" ]; then
            mv "$IMG" boot.img
            echo "RECOVERY_TYPE=boot" >> "$GITHUB_ENV"

          elif [ "${{ inputs.BUILD_TARGET }}" = "recovery" ]; then
            mv "$IMG" recovery.img
            echo "RECOVERY_TYPE=recovery" >> "$GITHUB_ENV"

          elif [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then
            mv "$IMG" vendor_boot.img
            echo "RECOVERY_TYPE=vendor_boot" >> "$GITHUB_ENV"

          else
            echo "ERROR: Invalid build target."
            exit 1
          fi

      - name: Include Recovery Installer
        if: ${{ inputs.RECOVERY_INSTALLER }}
        run: |
          set -e

          cd "$FILE_PATH"

          wget -O recovery-installer.zip \
            "https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip"

          zip -ur recovery-installer.zip "${RECOVERY_TYPE}.img"

      - name: Recovery to tar for Samsung devices
        if: ${{ inputs.RECOVERY_TAR }}
        run: |
          set -e

          cd "$FILE_PATH"

          tar -cvf "${RECOVERY_TYPE}.tar" "${RECOVERY_TYPE}.img"

      - name: Upload to Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
            ${{ env.FILE_PATH }}/recovery-installer.zip
            ${{ env.FILE_PATH }}/OrangeFox*.zip
          name: Unofficial OrangeFox for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Build: ${{ inputs.MANIFEST_BRANCH }}
            Device: ${{ inputs.DEVICE_NAME }}
            Device Tree: ${{ inputs.DEVICE_TREE }}
            Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            Commit: ${{ env.COMMIT_ID }}
            MD5: ${{ env.MD5_IMG }}

      - name: Release ramdisk-recovery
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
            ${{ env.FILE_PATH }}/ramdisk-recovery.*
          name: Unofficial OrangeFox for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Target: ${{ env.RECOVERY_TYPE }}.img
            Build: ${{ inputs.MANIFEST_BRANCH }}
            Device: ${{ inputs.DEVICE_NAME }}
            Commit: ${{ env.COMMIT_ID }}
            MD5: ${{ env.MD5_IMG }}

      - name: Run LDCheck
        continue-on-error: true
        run: |
          cd tools

          if [ -d "$FILE_PATH/recovery/root" ]; then
            cp -r libneeds "$FILE_PATH/recovery/root/" 2>/dev/null || true
            cp ldcheck "$FILE_PATH/recovery/root/" 2>/dev/null || true

            cd "$FILE_PATH/recovery/root"

            if [ -f ldcheck ]; then
              python3 ldcheck \
                -p system/lib64:vendor/lib64:system/lib:vendor/lib \
                -d "${{ inputs.LDCHECK }}"
            fi
          fi
```
