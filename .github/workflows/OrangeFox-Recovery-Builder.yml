```yaml
name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '11.0'

      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/rimurum/android_device_nothing_Pacman'

      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'android-15'

      DEVICE_PATH:
        description: 'Specify your device path'
        required: true
        default: 'device/nothing/Pacman'

      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'Pacman'

      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
          - 'boot'
          - 'recovery'
          - 'vendorboot'

      LDCHECK:
        description: 'Path of blobs to check'
        required: false
        default: 'system/bin/qseecomd'

      RECOVERY_TAR:
        description: 'Release recovery.tar for Samsung devices'
        required: false
        default: false
        type: boolean

      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        required: true
        default: true
        type: boolean


jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest

    # Only allow the repository owner to start the build.
    if: github.repository_owner == github.actor

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Display Inputs
      # ------------------------------------------------------------
      - name: Display Inputs
        run: |
          echo "========================================"
          echo "OrangeFox Recovery Builder"
          echo "========================================"
          echo "Manifest branch : ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device tree     : ${{ inputs.DEVICE_TREE }}"
          echo "Device branch   : ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device path     : ${{ inputs.DEVICE_PATH }}"
          echo "Device name     : ${{ inputs.DEVICE_NAME }}"
          echo "Build target    : ${{ inputs.BUILD_TARGET }}"
          echo "LDCheck         : ${{ inputs.LDCHECK }}"
          echo "Recovery TAR    : ${{ inputs.RECOVERY_TAR }}"
          echo "Installer       : ${{ inputs.RECOVERY_INSTALLER }}"
          echo "========================================"


      # ------------------------------------------------------------
      # Clean GitHub runner
      # ------------------------------------------------------------
      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main


      # ------------------------------------------------------------
      # Swap
      # ------------------------------------------------------------
      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24


      # ------------------------------------------------------------
      # Build environment
      # ------------------------------------------------------------
      - name: Build Environment
        shell: bash
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            zip \
            unzip \
            rsync

          git clone https://gitlab.com/OrangeFox/misc/scripts "$GITHUB_WORKSPACE/of_build_scripts"

          cd "$GITHUB_WORKSPACE/of_build_scripts"

          sudo bash setup/android_build_env.sh


      # ------------------------------------------------------------
      # Sync OrangeFox source
      # ------------------------------------------------------------
      - name: Set-up Manifest
        shell: bash
        run: |
          set -e

          FOX_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

          echo "Creating OrangeFox directory:"
          echo "$FOX_DIR"

          mkdir -p "$FOX_DIR"

          cd "${GITHUB_WORKSPACE}/OrangeFox"

          git config --global user.name "OrangeFox Builder"
          git config --global user.email "github-actions@github.com"

          if [ ! -d sync ]; then
            git clone https://gitlab.com/OrangeFox/sync.git
          fi

          cd sync

          chmod +x orangefox_sync.sh

          echo "========================================"
          echo "Starting OrangeFox sync"
          echo "Branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Path:   $FOX_DIR"
          echo "========================================"

          ./orangefox_sync.sh \
            --branch "${{ inputs.MANIFEST_BRANCH }}" \
            --path "$FOX_DIR"

          echo "========================================"
          echo "Checking synced source"
          echo "========================================"

          if [ ! -d "$FOX_DIR" ]; then
            echo "ERROR: OrangeFox sync did not create:"
            echo "$FOX_DIR"
            exit 1
          fi

          if [ ! -f "$FOX_DIR/build/envsetup.sh" ]; then
            echo "ERROR: build/envsetup.sh was not found."
            echo "OrangeFox source was not synced correctly."
            exit 1
          fi

          echo "OrangeFox source successfully synced."


      # ------------------------------------------------------------
      # Clone device tree
      # ------------------------------------------------------------
      - name: Clone Device Tree
        shell: bash
        run: |
          set -e

          FOX_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
          DEVICE_DIR="$FOX_DIR/${{ inputs.DEVICE_PATH }}"

          echo "OrangeFox source:"
          echo "$FOX_DIR"

          echo "Device tree:"
          echo "${{ inputs.DEVICE_TREE }}"

          echo "Device branch:"
          echo "${{ inputs.DEVICE_TREE_BRANCH }}"

          echo "Device path:"
          echo "$DEVICE_DIR"

          if [ ! -d "$FOX_DIR" ]; then
            echo "ERROR: OrangeFox source directory does not exist."
            exit 1
          fi

          mkdir -p "$(dirname "$DEVICE_DIR")"

          git clone \
            --depth=1 \
            --branch "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" \
            "$DEVICE_DIR"

          cd "$DEVICE_DIR"

          COMMIT_ID=$(git rev-parse HEAD)

          echo "COMMIT_ID=$COMMIT_ID" >> "$GITHUB_ENV"

          echo "Device tree commit:"
          echo "$COMMIT_ID"


      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Building OrangeFox
        shell: bash
        run: |
          set -e

          FOX_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

          cd "$FOX_DIR"

          echo "========================================"
          echo "OrangeFox build"
          echo "========================================"

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          if [ "${{ inputs.MANIFEST_BRANCH }}" = "11.0" ] || [ "${{ inputs.MANIFEST_BRANCH }}" = "12.1" ]; then

            echo "Using TWRP/OrangeFox lunch configuration"

            lunch "twrp_${{ inputs.DEVICE_NAME }}-eng"

            make clean

            mka adbd "${{ inputs.BUILD_TARGET }}image"

          else

            echo "Using Omni configuration"

            lunch "omni_${{ inputs.DEVICE_NAME }}-eng"

            make clean

            mka "${{ inputs.BUILD_TARGET }}image"

          fi


      # ------------------------------------------------------------
      # Set build date
      # ------------------------------------------------------------
      - name: Set Build Date
        shell: bash
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # Find generated OrangeFox image
      # ------------------------------------------------------------
      - name: Check if Recovery Exists
        shell: bash
        run: |
          set -e

          FOX_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
          PRODUCT_DIR="$FOX_DIR/out/target/product/${{ inputs.DEVICE_NAME }}"

          echo "Checking:"
          echo "$PRODUCT_DIR"

          if [ ! -d "$PRODUCT_DIR" ]; then
            echo "ERROR: Product directory does not exist."
            echo "Build probably failed."
            exit 1
          fi

          echo "Files in product directory:"
          find "$PRODUCT_DIR" -maxdepth 2 -type f | sort | head -200

          IMG=$(find "$PRODUCT_DIR" -maxdepth 1 -type f -name 'OrangeFox*.img' | head -n 1)

          # Some broken/old build layouts can produce the image deeper down.
          if [ -z "$IMG" ]; then
            IMG=$(find "$PRODUCT_DIR" -type f -name 'OrangeFox*.img' | head -n 1)
          fi

          if [ -z "$IMG" ]; then
            echo "ERROR: No OrangeFox*.img was found."
            exit 1
          fi

          FILE_PATH=$(dirname "$IMG")

          echo "Found image:"
          echo "$IMG"

          echo "FILE_PATH=$FILE_PATH" >> "$GITHUB_ENV"
          echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"

          MD5_IMG=$(md5sum "$IMG" | cut -d ' ' -f 1)

          echo "MD5_IMG=$MD5_IMG" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # Rename image
      # ------------------------------------------------------------
      - name: Rename the Recovery
        shell: bash
        run: |
          set -e

          cd "$FILE_PATH"

          IMG=$(find . -maxdepth 1 -type f -name 'OrangeFox*.img' | head -n 1)

          if [ -z "$IMG" ]; then
            echo "ERROR: OrangeFox image not found."
            exit 1
          fi

          case "${{ inputs.BUILD_TARGET }}" in

            boot)
              mv "$IMG" boot.img
              echo "RECOVERY_TYPE=boot" >> "$GITHUB_ENV"
              echo "Created boot.img"
              ;;

            recovery)
              mv "$IMG" recovery.img
              echo "RECOVERY_TYPE=recovery" >> "$GITHUB_ENV"
              echo "Created recovery.img"
              ;;

            vendorboot)
              mv "$IMG" vendor_boot.img
              echo "RECOVERY_TYPE=vendor_boot" >> "$GITHUB_ENV"
              echo "Created vendor_boot.img"
              ;;

            *)
              echo "ERROR: Unknown build target."
              exit 1
              ;;

          esac


      # ------------------------------------------------------------
      # Include Recovery Installer
      # ------------------------------------------------------------
      - name: Include Recovery Installer
        if: ${{ inputs.RECOVERY_INSTALLER }}
        shell: bash
        run: |
          set -e

          cd "$FILE_PATH"

          wget -O recovery-installer.zip \
            https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip

          zip -ur recovery-installer.zip "${RECOVERY_TYPE}.img"

          echo "Recovery installer created."


      # ------------------------------------------------------------
      # Recovery to TAR
      # ------------------------------------------------------------
      - name: Recovery to tar for Samsung devices
        if: ${{ inputs.RECOVERY_TAR }}
        shell: bash
        run: |
          set -e

          cd "$FILE_PATH"

          tar -cvf "${RECOVERY_TYPE}.tar" "${RECOVERY_TYPE}.img"

          echo "Samsung TAR created."


      # ------------------------------------------------------------
      # Upload build artifacts to GitHub Release
      # ------------------------------------------------------------
      - name: Upload to Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
            ${{ env.FILE_PATH }}/recovery-installer.zip
            ${{ env.FILE_PATH }}/OrangeFox*.zip

          name: Unofficial OrangeFox for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}

          tag_name: ${{ github.run_id }}

          body: |
            Build: ${{ inputs.MANIFEST_BRANCH }}
            Device: ${{ inputs.DEVICE_NAME }}

            Device Tree:
            ${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }}

            Commit:
            ${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}

            MD5:
            ${{ env.MD5_IMG }}


      # ------------------------------------------------------------
      # Release ramdisk-recovery files
      # ------------------------------------------------------------
      - name: Release ramdisk-recovery
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
            ${{ env.FILE_PATH }}/ramdisk-recovery.*

          name: Unofficial OrangeFox for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}

          tag_name: ${{ github.run_id }}

          body: |
            Target: ${{ env.RECOVERY_TYPE }}.img
            Build: ${{ inputs.MANIFEST_BRANCH }}
            Device: ${{ inputs.DEVICE_NAME }}

            Device Tree:
            ${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }}

            Commit:
            ${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}

            MD5 (img):
            ${{ env.MD5_IMG }}


      # ------------------------------------------------------------
      # LDCheck
      # ------------------------------------------------------------
      - name: Run LDCheck
        shell: bash
        continue-on-error: true
        run: |
          set -e

          FOX_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
          RECOVERY_ROOT="$FILE_PATH/recovery/root"

          cd "$GITHUB_WORKSPACE/tools"

          if [ -d "$RECOVERY_ROOT" ]; then

            cp -r libneeds "$RECOVERY_ROOT/" 2>/dev/null || true
            cp ldcheck "$RECOVERY_ROOT/" 2>/dev/null || true

            cd "$RECOVERY_ROOT"

            if [ -f ldcheck ]; then
              python3 ldcheck \
                -p system/lib64:vendor/lib64:system/lib:vendor/lib \
                -d "${{ inputs.LDCHECK }}"

              echo "Done checking missing dependencies."
            else
              echo "ldcheck not found."
            fi

          else
            echo "Recovery root directory not found."
            echo "Skipping LDCheck."
          fi
```
