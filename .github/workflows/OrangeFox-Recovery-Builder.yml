```yaml
name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - 12.1
          - 11.0

      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/rimurum/android_device_nothing_Pacman'

      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'android-15'

      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/nothing/Pacman'

      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'Pacman'

      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot

      LDCHECK:
        description: 'Path of blobs to check'
        required: false
        default: 'system/bin/qseecomd'

      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean

      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        required: true
        default: true
        type: boolean


jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest

    if: github.repository_owner == github.actor

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # DISPLAY INPUTS
      # ---------------------------------------------------------

      - name: Display Inputs
        run: |
          echo "========================================"
          echo "OrangeFox Build Configuration"
          echo "========================================"
          echo "Manifest Branch:      ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree:          ${{ inputs.DEVICE_TREE }}"
          echo "Device Tree Branch:   ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path:          ${{ inputs.DEVICE_PATH }}"
          echo "Device Name:          ${{ inputs.DEVICE_NAME }}"
          echo "Build Target:         ${{ inputs.BUILD_TARGET }}"
          echo "LDCheck Path:         ${{ inputs.LDCHECK }}"
          echo "Recovery TAR:         ${{ inputs.RECOVERY_TAR }}"
          echo "Recovery Installer:   ${{ inputs.RECOVERY_INSTALLER }}"
          echo "========================================"


      # ---------------------------------------------------------
      # CLEAN-UP
      # ---------------------------------------------------------

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main


      # ---------------------------------------------------------
      # SWAP SPACE
      # ---------------------------------------------------------

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24


      # ---------------------------------------------------------
      # BUILD ENVIRONMENT
      # ---------------------------------------------------------

      - name: Build Environment
        run: |
          set -e

          sudo apt update
          sudo apt -y upgrade

          git clone https://gitlab.com/OrangeFox/misc/scripts

          cd scripts

          sudo bash setup/android_build_env.sh


      # ---------------------------------------------------------
      # SET UP ORANGEFOX MANIFEST
      # ---------------------------------------------------------

      - name: Set-up Manifest
        run: |
          set -e

          FOX_PATH="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

          echo "========================================"
          echo "Setting up OrangeFox"
          echo "========================================"
          echo "GITHUB_WORKSPACE:"
          echo "${GITHUB_WORKSPACE}"
          echo ""
          echo "Manifest branch:"
          echo "${{ inputs.MANIFEST_BRANCH }}"
          echo ""
          echo "OrangeFox path:"
          echo "${FOX_PATH}"
          echo "========================================"

          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"

          cd "${GITHUB_WORKSPACE}/OrangeFox"

          git config --global user.name "Pantelis"
          git config --global user.email "rimurum@pm.me"

          if [ ! -d "sync" ]; then
            echo "Cloning OrangeFox sync repository..."
            git clone https://gitlab.com/OrangeFox/sync.git
          fi

          cd sync

          chmod +x orangefox_sync.sh

          echo "========================================"
          echo "Running OrangeFox sync"
          echo "========================================"

          ./orangefox_sync.sh \
            --branch "${{ inputs.MANIFEST_BRANCH }}" \
            --path "${FOX_PATH}"

          echo "========================================"
          echo "Checking OrangeFox source"
          echo "========================================"

          if [ ! -d "${FOX_PATH}" ]; then
            echo "ERROR: OrangeFox source directory was not created!"
            echo ""
            echo "Expected:"
            echo "${FOX_PATH}"
            echo ""
            echo "OrangeFox directory contents:"
            ls -lah "${GITHUB_WORKSPACE}/OrangeFox" || true
            echo ""
            echo "Searching for directories:"
            find "${GITHUB_WORKSPACE}/OrangeFox" -maxdepth 3 -type d -print || true
            exit 1
          fi

          echo "OrangeFox source found!"
          echo ""
          echo "Source directory:"
          ls -lah "${FOX_PATH}"

          echo "========================================"
          echo "Manifest setup completed"
          echo "========================================"


      # ---------------------------------------------------------
      # CLONE DEVICE TREE
      # ---------------------------------------------------------

      - name: Clone Device Tree
        run: |
          set -e

          FOX_PATH="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

          echo "========================================"
          echo "Checking OrangeFox source"
          echo "========================================"

          if [ ! -d "${FOX_PATH}" ]; then
            echo "ERROR: OrangeFox source directory does not exist!"
            echo "${FOX_PATH}"
            exit 1
          fi

          cd "${FOX_PATH}"

          echo "Current directory:"
          pwd

          echo ""
          echo "Cloning device tree..."

          mkdir -p "$(dirname "${{ inputs.DEVICE_PATH }}")"

          git clone \
            "${{ inputs.DEVICE_TREE }}" \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "./${{ inputs.DEVICE_PATH }}"

          cd "${{ inputs.DEVICE_PATH }}"

          COMMIT_ID=$(git rev-parse HEAD)

          echo "Device tree commit: ${COMMIT_ID}"

          echo "COMMIT_ID=${COMMIT_ID}" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # BUILD ORANGEFOX
      # ---------------------------------------------------------

      - name: Building OrangeFox
        run: |
          set -e

          FOX_PATH="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

          echo "========================================"
          echo "Starting OrangeFox build"
          echo "========================================"

          if [ ! -d "${FOX_PATH}" ]; then
            echo "ERROR: OrangeFox source directory does not exist!"
            echo "${FOX_PATH}"
            exit 1
          fi

          cd "${FOX_PATH}"

          echo "Build directory:"
          pwd

          echo ""
          echo "Loading build environment..."

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          echo ""
          echo "========================================"
          echo "Starting build"
          echo "========================================"

          lunch twrp_${{ inputs.DEVICE_NAME }}-eng

          make clean

          mka adbd ${{ inputs.BUILD_TARGET }}image

          echo "========================================"
          echo "OrangeFox build finished"
          echo "========================================"


      # ---------------------------------------------------------
      # SET BUILD DATE
      # ---------------------------------------------------------

      - name: Set Build Date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # CHECK RECOVERY
      # ---------------------------------------------------------

      - name: Check if Recovery Exist
        run: |
          set -e

          FOX_PATH="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

          PRODUCT_PATH="${FOX_PATH}/out/target/product/${{ inputs.DEVICE_NAME }}"

          echo "========================================"
          echo "Checking recovery output"
          echo "========================================"

          echo "Product path:"
          echo "${PRODUCT_PATH}"

          if compgen -G "${PRODUCT_PATH}/OrangeFox*.img" > /dev/null; then

            echo "OrangeFox image found!"

            echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"
            echo "FILE_PATH=${PRODUCT_PATH}" >> "$GITHUB_ENV"

            MD5_IMG=$(md5sum ${PRODUCT_PATH}/OrangeFox*.img | cut -d ' ' -f 1)

            echo "MD5_IMG=${MD5_IMG}" >> "$GITHUB_ENV"

          elif compgen -G "${PRODUCT_PATH}/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img" > /dev/null; then

            echo "OrangeFox image found in nested directory!"

            NESTED_PATH="${PRODUCT_PATH}/target/product/${{ inputs.DEVICE_NAME }}"

            echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"
            echo "FILE_PATH=${NESTED_PATH}" >> "$GITHUB_ENV"

            MD5_IMG=$(md5sum ${NESTED_PATH}/OrangeFox*.img | cut -d ' ' -f 1)

            echo "MD5_IMG=${MD5_IMG}" >> "$GITHUB_ENV"

          else

            echo "ERROR: Recovery image was not found."

            echo ""
            echo "Searching for OrangeFox images..."

            find "${FOX_PATH}/out" \
              -type f \
              -name "OrangeFox*.img" \
              -print || true

            exit 1

          fi


      # ---------------------------------------------------------
      # RENAME RECOVERY
      # ---------------------------------------------------------

      - name: Rename the Recovery
        run: |
          set -e

          cd "${{ env.FILE_PATH }}"

          case "${{ inputs.BUILD_TARGET }}" in

            boot)
              mv OrangeFox*.img boot.img
              echo "RECOVERY_TYPE=boot" >> "$GITHUB_ENV"
              echo "boot.img file found!"
              ;;

            recovery)
              mv OrangeFox*.img recovery.img
              echo "RECOVERY_TYPE=recovery" >> "$GITHUB_ENV"
              echo "recovery.img file found!"
              ;;

            vendorboot)
              mv OrangeFox*.img vendor_boot.img
              echo "RECOVERY_TYPE=vendor_boot" >> "$GITHUB_ENV"
              echo "vendor_boot.img file found!"
              ;;

            *)
              echo "Invalid build target!"
              exit 1
              ;;

          esac

      # ---------------------------------------------------------
      # INCLUDE RECOVERY INSTALLER
      # ---------------------------------------------------------

      - name: Include Recovery Installer
        if: inputs.RECOVERY_INSTALLER == true
        run: |
          cd "${{ env.FILE_PATH }}/"

          wget \
            https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip

          zip -ur recovery-installer.zip "${{ env.RECOVERY_TYPE }}.img"


      # ---------------------------------------------------------
      # RECOVERY TO TAR
      # ---------------------------------------------------------

      - name: Recovery to tar for Samsung devices
        if: inputs.RECOVERY_TAR == true
        run: |
          cd "${{ env.FILE_PATH }}/"

          tar -cvf \
            "${{ env.RECOVERY_TYPE }}.tar" \
            "${{ env.RECOVERY_TYPE }}.img"


      # ---------------------------------------------------------
      # UPLOAD TO RELEASE
      # ---------------------------------------------------------

      - name: Upload to Release
        if: env.CHECK_IMG_IS_OK == 'true'

        uses: softprops/action-gh-release@v1

        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
            ${{ env.FILE_PATH }}/recovery-installer.zip
            ${{ env.FILE_PATH }}/OrangeFox*.zip

          name: Unofficial OrangeFox for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}

          tag_name: ${{ github.run_id }}

          body: |
            Build: ${{ inputs.MANIFEST_BRANCH }}

            Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})

            Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})


      # ---------------------------------------------------------
      # RELEASE RAMDISK RECOVERY
      # ---------------------------------------------------------

      - name: Release ramdisk-recovery
        if: env.CHECK_IMG_IS_OK == 'true'

        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981

        with:
          files: |
            ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
            ${{ env.FILE_PATH }}/ramdisk-recovery.*

          name: Unofficial OrangeFox for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}

          tag_name: ${{ github.run_id }}

          body: |
            Target: ${{ env.RECOVERY_TYPE }}.img

            Build: ${{ inputs.MANIFEST_BRANCH }}

            Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})

            Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})

            MD5 (img): ${{ env.MD5_IMG }}


      # ---------------------------------------------------------
      # LDCHECK
      # ---------------------------------------------------------

      - name: Run LDCheck
        if: env.CHECK_IMG_IS_OK == 'true'
        run: |
          cd tools

          mv -n libneeds "${{ env.FILE_PATH }}/recovery/root/" || true
          mv -n ldcheck "${{ env.FILE_PATH }}/recovery/root/" || true

          cd "${{ env.FILE_PATH }}/recovery/root/"

          python3 ldcheck \
            -p system/lib64:vendor/lib64:system/lib:vendor/lib \
            -d "${{ inputs.LDCHECK }}"

          echo "Done checking missing dependencies."
```
